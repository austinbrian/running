name: Sync Strava Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC / 1am ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Strava activities
        run: python scripts/sync_strava.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      - name: Commit updated activities
        run: |
          if git diff --quiet -- data/activities.json; then
            echo "No new activities."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json
          git commit -m "Sync Strava activities ($(date -u +%Y-%m-%d))"
          git push
