name: Sync Strava Data

on:
  schedule:
    # Hourly, and deliberately not on the hour: GitHub queues scheduled runs
    # and drops them under load, which is worst at :00. Public repos get
    # unlimited Actions minutes, so frequency costs nothing here.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Re-fetch every activity instead of only what is newer. Needed after
          adding a field to ACTIVITY_FIELDS, since existing records cannot grow
          one retroactively. Costs about six requests.
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Sync Strava activities to R2
        # inputs is null on the scheduled run, so this renders empty there.
        run: python scripts/sync_strava.py ${{ inputs.full && '--full' || '' }}
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
